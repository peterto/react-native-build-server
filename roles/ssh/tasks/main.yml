- name: Copy SSH Key Into Remote Host
  ansible.builtin.copy:
    src: ~/.ssh/id_ed25519.pub
    dest: /home/{{ ansible_user }}/.ssh/authorized_keys
    mode: '0600'
  when: ansible_facts['os_family'] == "Debian"
