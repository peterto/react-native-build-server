- name: Accept Android SDK licenses if not already accepted
  ansible.builtin.shell: yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses
  environment:
    ANDROID_HOME: /usr/lib/android-sdk
    ANDROID_SDK_ROOT: /usr/lib/android-sdk
    PATH: "/home/linuxbrew/.linuxbrew/share/android-commandlinetools/cmdline-tools/latest/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
  when: not android_sdk_licenses.stat.exists
  # when: android_sdk_license_check.results | map(attribute='stat.exists') | select('equalto', True) | list | length == 0

