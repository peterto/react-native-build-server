- name: Update permissions for Android SDK directory
  ansible.builtin.file:
    path: /usr/lib/android-sdk
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: yes
    mode: '0755'

- name: Ensure ANDROID_HOME is owned by the play user
  become: true
  ansible.builtin.file:
    path: "{{ ansible_env.ANDROID_HOME }}"
    owner: "{{ ansible_user }}"
    recurse: yes
  when: ansible_env.ANDROID_HOME is defined
