---
- name: Check if i386 architecture is enabled (Debian)
  become: true
  ansible.builtin.shell: dpkg --print-foreign-architectures | grep -qw i386
  register: i386_arch_enabled
  ignore_errors: true
  when: ansible_facts['os_family'] == "Debian"

- name: Enable i386 architecture (Debian)
  become: true
  ansible.builtin.shell: 
  args:
    cmd: 'dpkg --print-foreign-architectures | grep -qw i386 || dpkg --add-architecture i386'
  # args:
    # warn: false
  when: ansible_facts['os_family'] == "Debian" and not i386_arch_enabled.rc == 0

- name: Backup /etc/apt/sources.list (Debian)
  become: true
  ansible.builtin.copy:
    src: /etc/apt/sources.list
    dest: /etc/apt/sources.list.bak_ansible
  when: ansible_distribution == "Debian"

- name: Enable contrib and non-free in /etc/apt/sources.list (Debian)
  become: true
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: '^(deb(?:-src)?\s+\S+\s+\S+\s+)(main)(\s|$)'
    replace: '\1main contrib non-free\3'
    backup: yes
  when: ansible_distribution == "Debian"

- name: Update apt cache (Debian)
  become: true
  ansible.builtin.apt:
    update_cache: yes
  when: ansible_distribution == "Debian"

- name: Update apt cache after adding i386
  become: true
  ansible.builtin.apt:
    update_cache: yes
  when: ansible_facts['os_family'] == "Debian"

- name: Install Android Studio dependencies (Debian-based)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - libc6:i386
    - libncurses5-dev:i386
    - libstdc++6:i386
    - lib32z1
    - libbz2-1.0:i386
  when: ansible_facts['os_family'] == "Debian"

- name: Install Android Command Line Tools with Homebrew
  become: false
  community.general.homebrew:
    name: android-commandlinetools
    state: present

- name: Install Android Platform Line Tools with Homebrew
  become: false
  community.general.homebrew:
    name: android-platform-tools
    state: present

- name: Install Android SDK
  ansible.builtin.apt:
    name: android-sdk
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Set environment variable for ANDROID_HOME
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    line: 'export ANDROID_HOME=/usr/lib/android-sdk'
    state: present

- name: Set environment variable for ANDROID_TOOLS
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    line: 'export ANDROID_TOOLS=/usr/lib/android-sdk/tools/bin'
    state: present

- name: Set environment variable for ANDROID_PLATFORM_TOOLS
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    line: 'export ANDROID_PLATFORM_TOOLS=/usr/lib/android-sdk/platform-tools'
    state: present

- name: Set environment variable for ANDROID_SDK_ROOT
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    line: 'export ANDROID_SDK_ROOT=/usr/lib/android-sdk'
    state: present

- name: Add Android cmdline-tools to PATH
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    line: 'export PATH=$PATH:/home/linuxbrew/.linuxbrew/share/android-commandlinetools/cmdline-tools/latest/bin'
    state: present

- name: Check for Android SDK licenses
  ansible.builtin.stat:
    path: /usr/lib/android-sdk/licenses/android-sdk-license
  register: android_sdk_licenses

